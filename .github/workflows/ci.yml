name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build without optional collector
        run: ./scripts/build.sh
      - name: Run available tests
        run: ./scripts/test.sh
